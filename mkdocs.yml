site_name: mokata
# Brand tagline (assets/brand/BRAND.md): one tagline everywhere, verbatim.
site_description: >-
  The memory + seatbelt for your AI coding agent. Spec-driven TDD for
  Claude Code — knowledge-aware, human-gated, local-first.
repo_url: https://github.com/JasGujral/mokata-oss
site_url: https://mokata.ai/
copyright: "© MoStack — Apache-2.0"

theme:
  name: material
  custom_dir: overrides
  logo: assets/brand/mokata-wordmark-dark.svg
  favicon: assets/brand/mokata-icon.svg
  font:
    text: Inter
    code: JetBrains Mono
  features:
    # Left panel (navigation)
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    # Right panel (table of contents) — do NOT enable toc.integrate, which would
    # merge the TOC into the left nav and collapse the three-panel layout.
    - toc.follow
    # Content + search
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  # Brand: dark-only terminal theme, code-green accent (see docs/stylesheets/mokata.css)
  palette:
    scheme: slate
    primary: black
    accent: green

extra_css:
  - stylesheets/mokata.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true

# Internal docs are never part of a site build — even one run from the private repo.
# (Defense-in-depth alongside scripts/sync-public.sh, which keeps them out of the public repo.)
exclude_docs: |
  build/
  launch/
  marketing/
  # Brand asset doc, not a site page — keeps it out of nav (no "exists but not in nav" INFO).
  assets/brand/BRAND.md

nav:
  - Home: index.md
  - Get started: getting-started.md
  - Quickstart: quickstart.md
  - Tutorials:
      - Catches a bad change (60s): tutorials/catches-a-bad-change.md
