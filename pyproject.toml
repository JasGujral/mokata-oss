[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mokata"
version = "0.0.9"
description = "The memory + seatbelt for your AI coding agent. Spec-driven TDD for Claude Code — knowledge-aware, human-gated, local-first."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "MoStack" }]
keywords = ["claude-code", "tdd", "spec-driven", "framework", "ai-assisted-coding"]

# The MCP SDK is the ONE default dependency (Stage 3b.1). mokata is plugin-first (Stage 21),
# so its primary surface — the `mokata-mcp` server that exposes mokata as native Claude Code
# tools — must work from a plain `pip install mokata`, not only from the `[mcp]` extra. The
# environment marker keeps this a clean no-op on Python 3.9 (the SDK needs >= 3.10) instead of
# a resolution error: on 3.9 the MCP server is unavailable and `mokata-mcp` fails LOUD with a
# fix, while the CLI + everything else still run. The SDK stays LAZILY imported
# (mcp_server.build_server), so the core and CLI still import and run with it absent (3.9, or a
# stripped env). Every OTHER external tool mokata orchestrates remains optional with a built-in
# fallback (see capability router / graceful degradation).
dependencies = ['mcp>=1.2; python_version >= "3.10"']

[project.optional-dependencies]
# Optional upgrades. Absence is detected and degraded over, never fatal.
schema = ["jsonschema>=4.0"]
# `[mcp]` is now a no-op ALIAS of the default MCP SDK dependency above (same spec + marker),
# kept so an existing `pip install "mokata[mcp]"` still resolves cleanly.
mcp = ['mcp>=1.2; python_version >= "3.10"']
# Optional hosted/remote memory backend (Stage 24A): the Postgres store. Lazy-imported;
# the core, the CLI, and every default profile run with this absent (memory degrades to
# the SQLite floor). Opt-in only — a remote store is explicit user wiring (local-first).
postgres = ["psycopg>=3.1"]
# Optional external codebase-graph backend (Stage 35f): query a team-populated Neo4j graph
# for structural questions. Lazy-imported; the core, the CLI, and every default profile run
# with this absent (code_graph degrades to the ripgrep→grep floor). Opt-in only — the URI and
# credentials come from env vars, never the committed manifest (local-first, no egress).
neo4j = ["neo4j>=5.0"]

[project.scripts]
mokata = "mokata.cli:main"
# The MCP server entry point (plugin-launched stdio). Importing the server needs the
# optional [mcp] extra; the entry point itself is always installed.
mokata-mcp = "mokata.mcp_server:main"
# The hook entry point (Stage 53b). Claude Code launches the SessionStart briefing +
# PreToolUse secret-guard as `mokata-hook <subcommand>` — resolved on PATH exactly like
# mokata-mcp, with no bare `python3` / `sh` / launch.sh resolution to fail on.
mokata-hook = "mokata.hook_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Stage 70 — the curated community-stack catalog (a versioned index.json + per-framework
# governed stack manifests) ships with the wheel so `mokata stacks` works from a pip/pipx
# install. The runtime source of truth is `mokata.stacks` (in-code), so this is a reviewable
# mirror + the file-backed catalog convention any git-org/vault reuses; absence is degrade-clean.
#
# Stage 3 — templates/, hooks/ and skills/ now live INSIDE the package and MUST ship in the
# wheel so `pip install <wheel> && mokata setup claude` works with no clone. Explicit-depth
# globs (not `**`) so packaging is deterministic across every setuptools >= 61:
#   templates/README.md, templates/manifest.schema.json, templates/commands/*.md
#   hooks/hooks.json, hooks/launch.sh, hooks/*.py
#   skills/<name>/SKILL.md
mokata = [
    "stacks/*.json",
    "templates/*",
    "templates/commands/*",
    "hooks/*",
    "skills/*",
    "skills/*/*",
]
