[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mokata"
version = "0.0.20"
description = "The memory + seatbelt for your AI coding agent. Spec-driven TDD for Claude Code — knowledge-aware, human-gated, local-first."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "MoStack" }]
keywords = ["claude-code", "tdd", "spec-driven", "framework", "ai-assisted-coding"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# The MCP SDK is the ONE unconditional runtime dependency (Stage 3b.1). mokata is plugin-first
# (Stage 21), so its primary surface — the `mokata-mcp` server that exposes mokata as native
# Claude Code tools — must work from a plain `pip install mokata`, not only from the `[mcp]`
# extra. With the Python >= 3.10 floor (TM.S0) the SDK installs everywhere mokata does, so the
# old `python_version >= "3.10"` env marker is gone. The SDK stays LAZILY imported
# (mcp_server.build_server), so the core and CLI still import and run in a stripped/broken env
# with it absent — where `mokata-mcp` then fails LOUD with a fix. Every OTHER external tool
# mokata orchestrates remains optional with a built-in fallback (see capability router /
# graceful degradation).
#
# ⚠ THE UPPER BOUND IS LOAD-BEARING (MCP-SDK-2-BREAKS-THE-SERVER, 0.0.18). `mcp` 2.0.0 (released
# 2026-07-28) REMOVED `mcp.server.fastmcp` — the module `mcp/server.py` builds the whole server on.
# With no ceiling here, a fresh resolve took 2.0.0 and every `pip install mokata` from that day
# produced a mokata whose MCP surface (61 tools) could not start. v0.0.17 shipped 2026-08-08,
# eleven days into it. Supporting 2.x is a PORT, not a version bump — do not widen this bound
# without doing that port. `SDK_MIN_VERSION`/`SDK_MAJOR_CEILING` in `mcp/server.py` mirror it and
# are asserted equal to it by `test_mcp_sdk_2_breaks_the_server`.
dependencies = ['mcp>=1.2,<2']

[project.optional-dependencies]
# Optional upgrades. Absence is detected and degraded over, never fatal.
schema = ["jsonschema>=4.0"]
# `[mcp]` is a no-op ALIAS of the default MCP SDK dependency above (same spec), kept so an
# existing `pip install "mokata[mcp]"` still resolves cleanly.
mcp = ['mcp>=1.2,<2']
# Optional hosted/remote memory backend (Stage 24A): the Postgres store. Lazy-imported;
# the core, the CLI, and every default profile run with this absent (memory degrades to
# the SQLite floor). Opt-in only — a remote store is explicit user wiring (local-first).
postgres = ["psycopg>=3.1"]
# 0.0.18 lane D stage 14 — the `[neo4j]` extra is GONE with the backend it installed a driver
# for. An extra is a SELL SURFACE, not a dependency list: `pip install "mokata[neo4j]"` is a
# published, resolvable instruction, so leaving it would have shipped a release that still sells
# the driver for a backend it deleted — and no import-graph sweep reaches packaging metadata.
# DB.S4 — the ONE blessed embeddings extra: model2vec STATIC embeddings (a distilled lookup
# table — numpy-only, no torch, ~30MB, CPU-fast). Lazy-imported and AUTO-DETECTED: with it
# absent, `make_embedder("auto")` returns the zero-dep HashingEmbedder and everything still
# works, just on token-hash similarity instead of meaning (`mokata doctor` says which). Installed
# only on explicit consent (P2) via the setup offer. Heavy families
# (sentence-transformers / hosted APIs) stay documented-never-bundled.
embeddings = ["model2vec>=0.3", "numpy>=1.24"]
# 0.0.20 stage 05 (G14, doc 105 §9) — the TypeScript/TSX code-graph parser. Lazy-imported
# and AUTO-DETECTED, exactly like `[embeddings]`: absent, TS files are simply not in the
# graph corpus and `mokata doctor` says so; present, they are, with no flag and no config.
# ⛔ AN EXTRA RATHER THAN A BASE DEPENDENCY, and the reason is not the size. Adding it to the
# base install changes the dependency surface of EVERY existing user, including ones who
# will never open a .ts file — and in an organisation that surface is a reviewed, pinned,
# audited artifact, so an unrequested transitive is a lockfile re-review, an SBOM row and a
# supply-chain gate entry. This project ships `--require-hashes` pins, provenance
# attestation and a Scorecard delta for exactly that audience; "installed only on explicit
# consent" (P2) is what makes mokata reviewable.
# ⚠ MEASURED 2026-08-27, because the ruling was made from a figure that was wrong: TWO
# packages, 5.1 MB installed — tree-sitter 2.0 MB (per-CPython wheel, NOT abi3) and
# tree-sitter-typescript 3.1 MB (cp39-abi3). Both MIT, both wheels, no compiler. The costing
# said "ONE MIT abi3 wheel, 2.41 MB", which was one wheel's DOWNLOAD size.
graph-ts = ["tree-sitter>=0.23", "tree-sitter-typescript>=0.23"]

[project.scripts]
mokata = "mokata.cli:main"
# The MCP server entry point (plugin-launched stdio). The MCP SDK it imports is an
# unconditional dependency, so a plain `pip install mokata` makes this runnable.
mokata-mcp = "mokata.mcp_server:main"
# The hook entry point (Stage 53b). Claude Code launches the SessionStart briefing +
# PreToolUse secret-guard as `mokata-hook <subcommand>` — resolved on PATH exactly like
# mokata-mcp, with no bare `python3` / `sh` / launch.sh resolution to fail on.
mokata-hook = "mokata.hook_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Stage 70 — the curated community-stack catalog (a versioned index.json + per-framework
# governed stack manifests) ships with the wheel so `mokata stacks` works from a pip/pipx
# install. The runtime source of truth is `mokata.stacks` (in-code), so this is a reviewable
# mirror + the file-backed catalog convention any git-org/vault reuses; absence is degrade-clean.
#
# Stage 3 — templates/, hooks/ and skills/ now live INSIDE the package and MUST ship in the
# wheel so `pip install <wheel> && mokata setup claude` works with no clone. Explicit-depth
# globs (not `**`) so packaging is deterministic across every setuptools >= 61:
#   templates/README.md, templates/manifest.schema.json, templates/commands/*.md
#   hooks/hooks.json, hooks/launch.sh, hooks/*.py
#   skills/<name>/SKILL.md
mokata = [
    "stacks/*.json",
    "templates/*",
    "templates/commands/*",
    "hooks/*",
    "skills/*",
    "skills/*/*",
]
