name: CodeQL

# Static analysis for the Python source: on every push/PR to the default branch, plus a
# weekly scheduled scan so newly-disclosed query packs catch latent issues. Least-privilege:
# the workflow reads the repo and writes only security alerts.
#
# BOTH branch names are listed on purpose: the PUBLIC mirror (mokata-oss) — the only repo
# this job runs on (see the `if:` gate below) — has default branch `main`, while the private
# dev mirror is `master`. Listing only `master` meant CodeQL NEVER fired on the public repo,
# so Scorecard's SAST check saw the config but "0 commits checked with a SAST tool". Same
# fix already applied to scorecard.yml. Keep `main` first so public pushes always match.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "27 3 * * 1"   # 03:27 UTC every Monday

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (python)
    # Code scanning is free on the PUBLIC mirror but needs paid GHAS on the private dev repo,
    # where the upload fails with "code scanning is not enabled". Gate to the public repo so
    # CodeQL only runs where it can succeed (matches ci.yml / release.yml / docs.yml).
    if: github.repository == 'JasGujral/mokata-oss'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@e0647621c2984b5ed2f768cb892365bf2a616ad1 # v4.37.2
        with:
          languages: python
          queries: security-and-quality
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@e0647621c2984b5ed2f768cb892365bf2a616ad1 # v4.37.2
        with:
          category: "/language:python"
