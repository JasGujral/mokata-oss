name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Least-privilege default: read-only workspace-wide; each job re-declares the minimum it needs.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }} · jsonschema=${{ matrix.jsonschema }} · shard ${{ matrix.shard }}/4
    # Stage 66 — cross-platform parity across Windows + Linux. Trimmed (0.0.9rc1) to a light
    # matrix: py3.12 only, and macOS dropped, because macOS runners bill at 10x and the full
    # matrix exhausts the private repo's monthly Actions allotment. Both jsonschema legs are
    # kept (absent/present) — that axis caught the 0.0.8-red bug, so it stays. The live-db job
    # below stays Linux-only (its services are Linux containers).
    #
    # ⚠ "py3.12 only" describes the `python:` AXIS and has never described the job: the declared
    # floor rides in `include` (one leg since 0.0.16, three since 0.0.18 stage 17). Read the
    # `include:` block below for what actually runs.
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    # ⭐ THE BOUND ON A WEDGE, and it is a JOB KEY rather than a change to any `run:` line — the
    # distinction is the whole reason this edit is allowed where an `< /dev/null` on the unit step
    # is not. PR #54 put a redirect on that invocation and turned it into 28 failures; a
    # job-level ceiling changes no test's environment, only how long GitHub waits.
    #
    # WHY IT WAS MISSING AND WHAT IT COST. This job had exactly one `timeout-minutes` — on the
    # two-process stress STEP below — and that step is `if: matrix.jsonschema == 'present'`. So
    # the `absent` legs ran with no bound anywhere. On run 32094654167 the
    # `windows · py3.12 · jsonschema=absent` leg's unit-suite step sat at 54m27s and was still
    # `in_progress` when the run was cancelled; because that job never completed, GitHub refused
    # log download FOR THE WHOLE RUN, so one wedged leg cost the evidence from all twelve.
    #
    # THE VALUE, DERIVED — not chosen. From the GitHub jobs API, every leg of this job that has
    # ever RUN TO COMPLETION on Windows (the slow OS; ubuntu legs are 11–15m):
    #
    #     run 32053041561   windows py3.12 absent    29m07s   <- slowest ever completed
    #     run 32053041561   windows py3.10 present   28m26s
    #     run 32094654167   windows py3.12 present   27m14s
    #     run 32094654167   windows py3.10 present   26m26s
    #     run 32053041561   windows py3.12 present   26m40s
    #
    # Run-to-run variance for the SAME leg across those two runs is +2.1% / -7.0%, so the spread
    # is small and the ceiling only has to clear the worst case with room for suite growth
    # (7061 -> 7082 tests between the two runs). 1.5 x 29m07s = 43.7m -> **44**.
    #
    # It sits >=15m above every leg that has ever finished and >=10m below the wedge it exists to
    # cut, and it turns a hang from 360 minutes (GitHub's default) into 44.
    #
    # ⛔ 44 WAS DERIVED FROM LEGS THAT RAN AGAINST A STORE THAT WAS NOT DURABLE, and 0.0.20 made it
    # durable: `PRAGMA synchronous=FULL` is now SET rather than inherited, which buys an fsync per
    # commit (MEASURED 70x per commit on the dev VM — 0.421ms vs 0.006ms). The 0.0.20 cut's Windows
    # leg is the first measurement on the other side of that change, and it is decisive:
    #
    #     unit-suite STEP alone, windows-latest, 0.0.20:   Ran 7935 tests in 2269.3s = 37m49s
    #
    # The slowest FULL job that had ever completed was 29m07s. One step now exceeds it, and the job
    # also pays install, the dedicated stress step (which re-runs the same storm), integration and
    # the smoke run — call it ~48m. 1.5 x 48 = 72 -> **70**, keeping this file's own rule (a
    # ceiling that clears the worst case with room for suite growth) rather than picking a number
    # that merely clears today.
    #
    # ⚠ AND THIS ONE IS HONESTLY WEAKER THAN THE 44 IT REPLACES, which must not be lost: 44 was
    # 1.5x a leg that had COMPLETED; 70 is 1.5x an ESTIMATE, because no Windows leg had completed
    # since the pragma landed. It was OWED a re-derivation from the first one that did.
    #
    # ✅ THE DEBT IS PAID. CI #141 on `release/0.0.20` @ c5bfa1f, 2026-09-20 — the first fully
    # green Windows run this project has had. Per-leg RUN TIME, measured:
    #     windows py3.10 present  32m05s
    #     windows py3.12 absent   37m37s   <- worst
    #     windows py3.12 present  33m54s
    #     ubuntu, all four legs   17m18s - 18m45s
    # So the estimate above (~48m) was PESSIMISTIC by ten minutes, Windows costs ~2x Linux for
    # this suite, and 70 is 1.86x the worst leg actually observed.
    #
    # ⛔ AND IT IS DELIBERATELY NOT TIGHTENED TO THE 1.5x THE RULE ASKS FOR (which would be 60).
    # One green run is one sample, not a distribution — these are the first Windows completion
    # times that have ever existed here, and the reason 44 was wrong was that it was derived from
    # too few. Tightening on n=1 would repeat that mistake with a smaller number. 70 stands until
    # there is a spread to derive from; `CI-CEILING-IS-DERIVED-ONCE-AND-NEVER-RE-DERIVED` is the
    # open row that owns getting one.
    #
    # 70 -> 89 (0.0.25 cut). CI #166 on mirror `main` (run 39560673950): every test GREEN, but
    # this job's own CI-CEILING step failed the windows py3.12/present leg — 3547 s (59m07s)
    # against 70 (1.18x, under the 1.2x floor). 1.5 x 3547 s = 88.7 -> **89**. That leg was ~2x
    # Linux and growing with every release: raising the ceiling only moved the cliff.
    #
    # 89 -> 45 (0.0.26 O6, WINDOWS-CI-TIME): the unit suite is SHARDED, four legs per OS in
    # parallel (`scripts/shard_tests.py`, balanced on the measured per-module record
    # `scripts/shard_durations.json`), so this ceiling bounds ONE SHARD, not the suite. Derived
    # from the record, not chosen: worst shard 1275 s on the recording box (incl. shard 1's
    # once-per-leg steps) x 1.8 provisional imbalance x 0.638 (Windows scale: CI #166's 3547 s
    # less 300 s overhead, over the record's 5086 s) + 300 s overhead = ~1764 s -> 1.5x = 45.
    # The 1.8 is the worst/mean the local 4-shard run actually showed (1091 s vs 602 s mean; the
    # record was measured on a contended box), so a worst Windows shard could reach ~30 min
    # before real Windows shard clocks exist; 29 (the balanced prediction) was too tight.
    # This is provisional until `shard_tests.py absorb` of the first sharded CI run: absorb drops the
    # imbalance allowance and `tests/test_o6_shard_tests.py` then derives the tighter number
    # (it reds if the record stops clearing this, or this sits >5 above what the record derives).
    timeout-minutes: 45
    # Every `run:` step uses bash on both OSes — windows-latest defaults to pwsh, which would
    # break the `mktemp -d` / `|| true` POSIX steps. windows-latest ships Git Bash.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest"]
        python: ["3.12"]
        jsonschema: ["absent", "present"]
        # WINDOWS-CI-TIME (0.0.26 O6): the unit suite runs as FOUR shards per leg, in parallel —
        # `scripts/shard_tests.py` splits `discover -s tests -t tests` by MEASURED per-module time
        # (`scripts/shard_durations.json`), every module in exactly one shard. The gate's
        # wall-clock is the slowest shard, not the whole suite. `4` is written three times — this
        # list, the `--of 4` on the unit step, and the job name — and
        # `tests/test_o6_shard_tests.py` reds when they part. The macOS includes carry it too.
        shard: [1, 2, 3, 4]
        # PY312-ONLY (0.0.24, owner ruling 2026-10-17): every leg runs Python 3.12. The three
        # 3.10 "floor" legs (added 0.0.16 / 0.0.18 stage 17) are gone — they doubled the Windows
        # wall-clock of the PR gate. Since 0.0.26 L12 (PY-FLOOR-3.12) `requires-python` is
        # ">=3.12": the floor IS this Python, so every PR tests it (`tests/test_ci_matrix_floor.py`
        # pins that they stay equal). The macOS leg below is 3.12 too.
        include:
          # MACOS-IS-THE-CUT-MACHINE-AND-HAS-NO-LEG (0.0.22 B1). Every cut is taken on macOS, and
          # until now nothing ran the suite there: two host-dependent reds surfaced in ONE day on
          # 2026-10-04 (`git <cmd> --help` handing off to `man`; `/var` vs `/private/var`), both
          # invisible on Linux. ONE leg, the primary Python and the fuller dependency surface —
          # macOS runner minutes bill at 10x, so this is the cheapest leg that answers the row.
          # BLOCKING, like every leg (POLICY_BLOCKING in tests/test_ci_matrix_floor.py). It runs on
          # the MIRROR ONLY (ruling R5, the billing ruling): the guard step below refuses — loudly,
          # never as a green skip — anywhere else.
          # One include PER SHARD: an include that overwrites `os` matches no crossed leg and is
          # added as exactly one new leg, so a single entry would be one UNSHARDED-named leg
          # running shard nothing.
          - { os: "macos-latest", python: "3.12", jsonschema: "present", shard: 1 }
          - { os: "macos-latest", python: "3.12", jsonschema: "present", shard: 2 }
          - { os: "macos-latest", python: "3.12", jsonschema: "present", shard: 3 }
          - { os: "macos-latest", python: "3.12", jsonschema: "present", shard: 4 }
    steps:
      - name: "macOS leg is mirror-only (0.0.22 ruling R5)"
        # A red, not a skip: a skipped leg reads GREEN, and a green macOS tick that ran nothing is
        # the exact false assurance this leg exists to remove. On the mirror this step is a no-op.
        if: runner.os == 'macOS' && github.repository != 'JasGujral/mokata-oss'
        run: |
          echo "::error::the macOS leg runs on JasGujral/mokata-oss only (billing ruling R5). This repository is ${GITHUB_REPOSITORY}; nothing was tested here."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Start the ceiling clock (CI-CEILING)
        # INTERNAL-ONLY-TESTS-RUN-ON-NO-RUNNER's ceiling half (0.0.25 Lane C). Starts after
        # checkout + setup-python (seconds, which the release job pays too). The last steps of
        # this job read it — see `scripts/ci_ceiling.py`.
        run: echo "MOKATA_CLOCK_T0=$(date +%s)" >> "$GITHUB_ENV"
      - name: Install mokata
        run: pip install -e .
      - name: Install workflow-lint test tooling (PyYAML — a test-only dep, not a mokata dep)
        # Hash-pinned (SC.S1 / OpenSSF Scorecard Pinned-Dependencies). requirements/ci.txt is
        # regenerated from requirements/ci.in — see requirements/README.md.
        run: pip install --require-hashes -r requirements/ci.txt
      - name: Install jsonschema (present matrix leg only)
        if: matrix.jsonschema == 'present'
        # Hash-pinned; jsonschema is pinned to the exact version mokata resolves in uv.lock.
        run: pip install --require-hashes -r requirements/jsonschema.txt
      - name: Ensure jsonschema absent (absent matrix leg)
        if: matrix.jsonschema == 'absent'
        run: pip uninstall -y jsonschema || true
      - name: Byte-compile
        run: python -m compileall -q src
      - name: Report the RESOLVED MCP SDK (MCP-SDK-2-BREAKS-THE-SERVER)
        # The resolve itself, printed, because for fifteen days nobody could see it. `ci.yml`
        # contained ZERO references to `mcp`: nothing installed a known-good SDK and nothing said
        # which one pip had picked, so `mcp` 2.0.0 arrived on 2026-07-28, broke the server, and
        # left no trace in the log a reader would notice.
        run: python -c "import importlib.metadata as m; print('resolved mcp ==', m.version('mcp'))"
      - name: MCP surface must actually START, not skip (MCP-SDK-2-BREAKS-THE-SERVER)
        # ⭐ THE LEG THAT WOULD HAVE CAUGHT IT ON 2026-07-28. This does what no previous job did:
        # it imports the real symbols `build_server()` needs and BUILDS THE SERVER. That check is
        # independent of the `<2` bound — it fails on any SDK the server cannot actually run on,
        # including one nobody predicted, which is why it is the leg and the bound is only the fix.
        #
        # `MOKATA_REQUIRE_MCP_SDK` is the positive control (GATE-COUNT-TRUTH). Two of the four SDK
        # dispositions may still skip on a developer's stripped checkout; on a leg that just
        # installed the SDK a skip would be the bug, so here every non-usable state is a failure
        # and "the check RAN" is asserted rather than assumed.
        #
        # `jsonschema: present` only: `mcp` hard-requires `jsonschema>=4.20.0`, so the `absent` leg
        # deliberately breaks the SDK's own import (disposition BROKEN). Demanding a usable SDK
        # there would red a leg for doing exactly what it is designed to do.
        # Shard 1 only (0.0.26 O6): once per leg, not once per shard; `shard_durations.json`'s
        # `fixed` block preloads shard 1 with this time so the balancer gives it fewer modules.
        if: matrix.jsonschema == 'present' && matrix.shard == 1
        env:
          MOKATA_REQUIRE_MCP_SDK: '1'
        run: python -m unittest discover -s tests -t tests -p "test_mcp_sdk_2_breaks_the_server.py" -v
      - name: Two-process stress (MS.S7 / M-7 — the multi-session release gate)
        # The COMBINED load that MS.S1-S6 only ever test one-at-a-time: two REAL processes on one
        # repo driving state + session registry + audit ledger + journal/flush + SQLite + undo log +
        # a bundle-name race, simultaneously. Called out as its OWN step (rather than left to the
        # unit-suite discover below, which also runs it) so that a red says "two windows can corrupt
        # a repo" instead of reddening an opaque 2800-test suite, and so its wall-clock is visible.
        #
        # Bounded by construction: 2 workers x 2000 seeded ops, ~7s on a dev box. `timeout-minutes`
        # is the backstop for the failure this stage most fears — a cross-process DEADLOCK, which
        # would otherwise hang the runner for its full 6h rather than failing.
        #
        # ⛔ RAISED FROM 5 AT THE 0.0.20 CUT, AND NOT BECAUSE THE TEST GOT FLAKY. 0.0.20 sets
        # `PRAGMA synchronous=FULL` explicitly rather than inheriting it from whatever compiled the
        # local libsqlite3, which buys an fsync per commit — MEASURED at 70x per commit on the dev
        # VM (0.421 ms vs 0.006 ms). This storm is ~4000 commits and Windows' FlushFileBuffers is
        # far dearer than a Linux fsync, so the Windows leg spent >180 s here and was killed at 5.
        # The pragma is a durability fix on human-approved writes and stays; what was calibrated
        # against a non-durable store is this number. ⭐ The ORDERING is the point: the test's own
        # `WORKER_REPORT_TIMEOUT_S` (600 s) sits INSIDE this cap, so a deadlock still fails as a
        # readable unittest error carrying a wall clock, and this only ever catches a run wedged
        # past that. Both bounds stay far below the 6h runner cap.
        # ⚠ The Windows cost is still unmeasured — the storm now PRINTS its wall clock, so restate
        # both numbers from that run rather than from this comment.
        #
        # On windows-latest this is also the first real exercise of oslock's `msvcrt` branch under
        # genuine contention (POSIX takes `fcntl`; the Windows half has only ever been dead code in
        # CI). One jsonschema leg per OS is enough — file locking is orthogonal to jsonschema, and
        # the unit-suite step re-runs it on every leg regardless (in whichever shard holds it).
        # Shard 1 only, like the MCP check above.
        if: matrix.jsonschema == 'present' && matrix.shard == 1
        timeout-minutes: 20
        run: python -m unittest discover -s tests -t tests -p "test_ms_s7_stress.py" -v
      - name: Run unit test suite (this shard)
        # MOKATA_REQUIRE_MCP_SDK carries into the whole suite so the NINE converted MCP gates
        # cannot skip either — under `mcp` 2.0.0 this suite reported `OK (skipped=8)` for fifteen
        # days. Empty on the `absent` leg, where a broken SDK is the point of the leg.
        #
        # WINDOWS-CI-TIME (0.0.26 O6): `shard_tests.py run` builds the suite with the SAME loader
        # call `python -m unittest discover -s tests -t tests` makes and runs this shard's modules
        # of it; the four shards together are that selection exactly (`-s`/`-t` are passed
        # through, and `tests/_invocation_parity.py` reads them). `--record` keeps the shard's unit
        # seconds for the tag-ceiling job below.
        env:
          MOKATA_REQUIRE_MCP_SDK: ${{ matrix.jsonschema == 'present' && '1' || '' }}
        run: python scripts/shard_tests.py run --shard ${{ matrix.shard }} --of 4 -s tests -t tests --record ci-clock/unit.json
      - name: Run integration suite (the release gate)
        # Shard 1 only (0.0.26 O6) — once per leg; its time preloads shard 1 in the balancer.
        if: matrix.shard == 1
        env:
          MOKATA_REQUIRE_MCP_SDK: ${{ matrix.jsonschema == 'present' && '1' || '' }}
        run: python -m unittest discover -s tests/integration -t tests/integration
      - name: Playbook smoke run (fresh init)
        if: matrix.shard == 1
        run: |
          tmp="$(mktemp -d)"
          mokata init --profile standard --yes --path "$tmp"
          mokata playbook --path "$tmp"
      - name: This job's ceiling still clears this leg (CI-CEILING)
        # The ceiling above was derived by hand and owed re-deriving "whenever the suite grows".
        # This leg measures itself and reds while the ceiling is still a one-line edit: under
        # 1.2x headroom it prints the 1.5x value to set (`scripts/ci_ceiling.py`). Per SHARD: each
        # shard leg measures itself against the one job ceiling, and `--record` keeps its time.
        run: python scripts/ci_ceiling.py --since "$MOKATA_CLOCK_T0" --workflow .github/workflows/ci.yml --job test --record ci-clock/job.json --group "${{ matrix.os }}-${{ matrix.jsonschema }}"
      - name: Keep this shard's clock (tag-ceiling job; `shard_tests.py absorb` re-balances on it)
        # EVERY leg, not only ubuntu: the ubuntu shards re-assemble the tag gate's time below, and
        # a Windows run's per-module seconds are what `scripts/shard_tests.py absorb` re-bases the
        # balancer on (Windows is the slow OS, and it is not uniformly slower). Kilobytes, 7 days.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-clock-${{ matrix.os }}-${{ matrix.jsonschema }}-${{ matrix.shard }}
          path: ci-clock/
          if-no-files-found: error
          retention-days: 7

  tag-ceiling:
    # ⭐ The one that would have saved v0.0.23: release.yml's `test` job was CANCELLED at its
    # 22-minute ceiling with no test failing (run 38966278058), so the tag never published.
    # Until 0.0.26 an ubuntu leg of `test` ran a SUPERSET of that job and measured release.yml's
    # ceiling itself. Sharded (O6), no single leg runs the whole suite any more — so this job
    # RE-ASSEMBLES the unsharded leg from the ubuntu shards' records: the per-leg steps once (the
    # largest job-minus-unit time) plus every shard's unit seconds. Same image, same Python as the
    # tag gate; measured on every PR, before a tag. A missing shard is CANNOT-ANSWER (exit 2),
    # never a partial sum that reads CLEARS.
    name: tag gate ceiling (re-assembled from the ubuntu shards)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Bounded by construction: checkout + one artifact download + a stdlib script, ~20 s.
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Collect the ubuntu shards' clocks
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ci-clock-ubuntu-latest-*
          path: ci-clock
      - name: The TAG gate's ceiling still clears this suite (CI-CEILING)
        run: python3 scripts/ci_ceiling.py --from-shards ci-clock --workflow .github/workflows/release.yml --job test

  ide-e2e:
    # IDE-E2E-IN-CI (0.0.26 O9). The browser end-to-end for `mokata ide` was run by hand, so a page
    # that rendered blank or threw on load could ship behind a green suite — no unit test loads the
    # page. `tests/e2e_ide/` builds SMALL fixture repos, starts `mokata ide --foreground` (this
    # checkout's src/) per flow and drives headless Chromium through the core flows: render + the
    # review's diff, ⌘P open, graph nodes, health, palette (>commands, /mokata, @symbol, :line),
    # tabs (close all / Alt+W / reopen / Alt+1), find (count, step, clean close), search (word,
    # P36 paging + Load more), the Activity drawer (a job listed and finished), the worktrees panel
    # (listed, Merge only PROPOSED — P2), and a repo mokata was never set up in. Every flow ends
    # with ZERO console errors / uncaught errors / unexpected HTTP errors. The big-repo scale suite
    # (tests/e2e_scale) stays nightly/manual. ubuntu only: the browser and the page are the same
    # everywhere; the server's OS behaviour is the unit legs' job. `MOKATA_REQUIRE_E2E=1` turns
    # "no browser" into a failure — a skipped e2e reads green and tested nothing.
    name: ide e2e · headless Chromium
    # ubuntu-24.04, not -latest: `ubuntu-latest` moved to Ubuntu 26 on 2026-10-19 and the pinned
    # playwright's `install --with-deps` does not know that OS yet (the 0.0.26 cut's red leg).
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # Measured locally: install ~1 min, the e2e ~25 s. 15 is a backstop for a wedged browser with
    # room for a slow package mirror (the 0.0.26 cut lost 10 minutes to apt alone).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the e2e set (playwright + mokata's runtime and [ide] deps), hash-pinned
        # No mokata install: the e2e runs THIS checkout's src/ (PYTHONPATH), so every package the
        # job fetches is hash-pinned in requirements/e2e.txt — no editable-install site added.
        run: pip install --require-hashes -r requirements/e2e.txt
      - name: Install the Chromium build that playwright version pins
        # No `--with-deps`: the ubuntu-24.04 image already carries Chromium's libraries (it ships
        # Google Chrome), and `--with-deps` spent the job's whole 10 minutes pulling CJK fonts from
        # a slow apt mirror on the 0.0.26 cut (run 40529842184) before a single test ran.
        run: python -m playwright install chromium
      - name: IDE end-to-end in a real browser
        env:
          MOKATA_REQUIRE_E2E: '1'
        # Run as a SCRIPT, not `unittest discover`: it is not part of the suite the release
        # preflight mirrors (`tests/_preflight_parity.py` reads every `discover -s tests…` as that
        # suite) and it never imports `tests/_support.py`, so it needs no PyYAML. It exits 2 when
        # it finds no flow — a runner that ran nothing never reads green.
        run: python tests/e2e_ide/run_e2e.py -v

  skill-evals:
    # SE.S1/S2 (0.0.26 L5) — A BROKEN SKILL TRIGGER REDS THE BUILD. Claude Code picks a skill from
    # its listing text (description + when_to_use); an edit that drops the phrases a skill fires on,
    # or drifts it into another skill's vocabulary, ships silently unless something grades it.
    # `scripts/skill_evals.py gate` grades every shipped skill/command against the near-miss corpus
    # (evals/skill_triggers/corpus/) and the replay mocks (evals/skill_triggers/replay/) — no model,
    # no API key, no network: mokata never needs a key, and neither does its CI. The live tier
    # (`claude plugin eval` on the owner's own login) runs at the cut, never here.
    name: skill-evals (trigger corpus + replay mocks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Measured locally (0.0.26 L5, 2 vCPU, load ~6): median of 5 = 2.1 s. No install step (stdlib
    # + src/ on the path). x100 for a cold runner -> 5.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Skill-trigger gate (lint + corpus + replay; exit 1 on any finding)
        run: python scripts/skill_evals.py gate

  security-lint:
    # SA.S1 (0.0.26 L6) — WHAT MOKATA SHIPS IS LINTED LIKE CODE. Hooks + an MCP server + skills is
    # the maximum-privilege plugin shape, and a skill is text the model acts on. Six lints over the
    # shipped tree (scripts/security_lint.py): unquoted user args / eval in skill+command shell, prompt-
    # injection markers + hidden characters + HTML comments, secrets in shipped files (mokata's own
    # 4-layer scanner), agentskills.io conformance, the MCP server's exact-version pin, and the
    # version lockstep. Exit 1 on any finding, 2 when a lint cannot run. Offline: no install, no key.
    name: security-lint (SA.S1 shipped-surface lints)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Measured locally (0.0.26 L6, 2 vCPU, load ~6): median of 5 = 5.5 s. No install step (stdlib +
    # src/ on the path). x50 for a cold runner -> 5.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Security lints (exit 1 on a finding, 2 when a lint cannot run)
        run: python scripts/security_lint.py

  spec-drift:
    # SD.S1 (0.0.26 L7) — DRIFT BETWEEN THE SPEC/ACs, THE DOCS AND THE CODE REDS THE BUILD. `mokata
    # docsync` with no target sweeps the public doc tree against the code (commands, slash forms,
    # skill counts, install path) and then checks the saved spec's AC anchors + AC-tagged tests
    # against the tree; any Blocking finding exits 1. Read-only: CI never reconciles — the fix is
    # `mokata docsync <doc> --reconcile` (human-gated) or `mokata spec amend`.
    name: spec-drift (docsync)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Measured locally (0.0.26 L7, 2 vCPU, load ~6): median of 5 = 0.7 s, plus `pip install .`
    # (~30 s cold). x10 -> 5.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install mokata
        # Non-editable on purpose: the editable self-install population is a counted, alert-
        # reconciled set (test_pinned_dependency_property); this job needs only the package.
        run: pip install .
      - name: docsync sweep + saved-spec drift (exit 1 on a Blocking finding)
        run: python -m mokata docsync

  hooks-execute:
    # HOOK-SHELL-AGNOSTIC — the deliverable that string assertions cannot replace.
    #
    # The falsified premise (that cmd.exe completes the extension-less shim path through the
    # Windows executable-extension search) survived precisely BECAUSE every existing test
    # asserted what mokata WIRES. A hook can be wired correctly and still never run, because
    # whether the shell can launch it is a separate question. So each leg here EXECUTES a hook
    # against a planted secret canary and demands exit 2 — a leg that cannot block is red.
    #
    # The shells are the ones the harness actually uses for a hook `command`, read out of the
    # shipped Claude Code rather than assumed: `sh -c` on macOS/Linux, Git Bash on Windows, or
    # PowerShell on Windows when Git Bash is absent. There is deliberately NO cmd.exe leg —
    # cmd.exe is never a hook shell, so a cmd leg would test a route the product never takes.
    name: hooks-execute · ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    # CI-JOBS-WITHOUT-A-TIMEOUT (0.0.19 stage 09). DERIVED, not typed, the same way `test`'s 44
    # above was: the slowest leg that has ever COMPLETED x 1.5. Across 148 completed leg-runs
    # the slowest is 83s (`windows · git bash`, run 30801432820); 1.5 x 83s = 124.5s -> **3**.
    # Until this stage it had none, so a wedged hook execution ran to GitHub's default 360 —
    # and an unfinished job blocks log download for EVERY other job in the run, so one wedge
    # costs the evidence from all twelve.
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  label: "linux · bash",         shell: bash, runner_shell: bash }
          - { os: macos-latest,   label: "macos · zsh",          shell: zsh,  runner_shell: bash }
          - { os: windows-latest, label: "windows · git bash",   shell: bash, runner_shell: bash }
          # The PowerShell leg is the one this stage exists for: a Windows box WITHOUT Git Bash.
          # The exec-form route must still block here — that is the whole fix. The shell-form
          # (plugin shim) half cannot run under PowerShell and the check REPORTS that skip
          # rather than passing it silently.
          - { os: windows-latest, label: "windows · powershell", shell: none, runner_shell: pwsh }
    defaults:
      run:
        shell: ${{ matrix.runner_shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install mokata
        run: pip install -e .
      - name: Install the suite's provisioning prerequisite (PyYAML, requirements/ci.txt)
        # 0.0.21 cut: tests/_support.py refuses (os._exit 2) on an unprovisioned interpreter
        # (NO-COMMAND-PROVISIONS-THE-INTERPRETER-THE-SUITE-NEEDS). Every job that imports the
        # suite must install what `test` installs, or it reports exit 2 and measures nothing.
        run: pip install --require-hashes -r requirements/ci.txt
      - name: EXECUTE the hooks and prove the gate blocks
        # Plants a real canary, runs the hook exactly as wired, asserts exit 2; a clean write
        # must exit 0. Non-zero here means mokata's enforcement plane is off on this leg.
        run: python tests/hook_execution_check.py --shell ${{ matrix.shell }}
      - name: Wiring assertions (the same legs, from the unit suite)
        run: python -m unittest discover -s tests -t tests -k test_hook_shell_agnostic

  live-db:
    name: live-db (postgres + pgvector)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # CI-JOBS-WITHOUT-A-TIMEOUT (0.0.19 stage 09). Slowest ever COMPLETED x 1.5: 138s (run
    # 30801100461) -> 207s -> **4**. ⚠ That 138s is from this job's FORMER shape, when it also
    # started a neo4j service (`live-db (postgres + pgvector + neo4j)`, n=103); the pgvector-only
    # shape's slowest is 35s over n=10. The larger is taken deliberately — 'has ever completed'
    # reads the job id's whole history, and a ceiling derived from ten runs of a three-week-old
    # shape would be the tighter number for the weaker reason.
    timeout-minutes: 4
    # SCHEMA: the postgres service starts UNPROVISIONED (a bare `mokata_test`), and since D1 a
    # runtime connect VERIFIES the schema and never creates it — so nothing here conjures tables
    # on first use. The test module provisions once in `setUpModule` through the real admin path
    # (`teamdb.provision` / `provision_vector` — the DDL `mokata team init` owns), exactly as an
    # operator would. Do NOT add a runtime-DDL escape hatch to make this job green: init
    # provisions, runtime verifies, and a genuinely unprovisioned DB SHOULD be red here.
    services:
      postgres:
        image: pgvector/pgvector:pg16    # ships the pgvector extension (init still CREATEs it)
        env:
          POSTGRES_USER: mokata
          POSTGRES_PASSWORD: mokata
          POSTGRES_DB: mokata_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mokata -d mokata_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MOKATA_LIVE_DB: "1"
      # Password-less DSN + PGPASSWORD (libpq) — no inline credential in the workflow.
      MOKATA_PG_DSN: "postgresql://mokata@localhost:5432/mokata_test"
      PGPASSWORD: "mokata"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Live extras (optional drivers) installed ONLY here — the core stays dependency-free.
      # pgvector needs no Python client: the backend uses psycopg + the DB extension.
      - name: Install mokata + live DB extras
        run: pip install -e ".[postgres]"
      - name: Install the suite's provisioning prerequisite (PyYAML, requirements/ci.txt)
        # 0.0.21 cut: tests/_support.py refuses (os._exit 2) on an unprovisioned interpreter
        # (NO-COMMAND-PROVISIONS-THE-INTERPRETER-THE-SUITE-NEEDS). Every job that imports the
        # suite must install what `test` installs, or it reports exit 2 and measures nothing.
        run: pip install --require-hashes -r requirements/ci.txt
      - name: Run the live-DB integration legs (required)
        run: >-
          python -m unittest discover -s tests/integration -t tests/integration
          -p "test_live_db.py" -v
