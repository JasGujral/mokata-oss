name: install-e2e

# 0.0.26 L1 — `FULL-INSTALLS-EVERYTHING-IN-ONE-GO` (doc 113 §2, first stage of Lane L; absorbs
# `WIN-FULL-SEMANTIC-OFF-AFTER-WITH-DEPS`). Supersedes 0.0.25 I-03's `--with-deps` legs.
#
# The bar: a stranger runs ONE install line and ONE setup, and gets every full-mode capability —
# on macOS, Linux and Windows, from uv tool, pipx or pip. Unit tests cannot see this: they inject
# the installer. This job runs the REAL installers on fresh runners and asks `mokata doctor`
# whether the capabilities are actually live.
#
#   1. ONE install line: `uv tool install ".[full]"` / `pipx install ".[full]"` /
#      `pip install ".[full]"` — the installer fetches everything (embeddings, graph-ts,
#      code-review-graph, ide).
#   2. ONE `mokata setup claude --mode full --yes`: it only detects and wires — it must never
#      start an installer (no "installing …" line), and every row must be active (no ✗, never
#      "PARTIALLY wired"). The model is fetched from huggingface.co, which runners reach.
#   3. `mokata doctor`: the code graph is code-review-graph (not a floor), semantic recall is
#      model2vec (not token-hash), and the repo's TypeScript is parsed (no `graph-ts-absent`).
#   4. The installer's own upgrade keeps the extra (uv tool upgrade / pipx reinstall).
#
# NOT A PR GATE ON EVERY CHANGE: each leg downloads ~360 MB. It runs when the install path
# changes, weekly, and by hand.
#
# ⚠ The installs below are LOCAL (`.` — this checkout) or hash-pinned (`requirements/uv.txt`), per
# the pinned-dependencies property (`tests/_supply_chain_sweep.py`). What `[full]` itself fetches
# (model2vec, code-review-graph, tree-sitter-typescript) is the product's own install path under
# test — the same residual `real-crg.yml` and `embeddings-leg.yml` carry.

on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 3"
  pull_request:
    paths:
      - "src/mokata/install_route.py"
      - "src/mokata/extras_install.py"
      - "src/mokata/adoption_modes.py"
      - "src/mokata/cli_commands/setup.py"
      - "src/mokata/harness_setup.py"
      - "src/mokata/knowledge/graph_adopt.py"
      - "src/mokata/memory/embed.py"
      - "src/mokata/govern/doctor.py"
      - "src/mokata/detect.py"
      - "pyproject.toml"
      - "requirements/uv.txt"
      - ".github/workflows/install-e2e.yml"

permissions:
  contents: read

jobs:
  install:
    name: install · ${{ matrix.route }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    # Measured (0.0.25): a cold full-deps install is ~1–3 min on a runner; the full-suite-free job
    # should finish well inside 15. 25 leaves room for a slow index without hiding a hang.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        route: [uv-tool, pipx, pip]
    defaults:
      run:
        shell: bash
    env:
      ROUTE: ${{ matrix.route }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Isolated tool dirs (a clean machine's view — nothing pre-installed is reused)
        run: |
          set -euo pipefail
          t="$RUNNER_TEMP/clean"
          mkdir -p "$t/uv-tools" "$t/uv-bin" "$t/pipx" "$t/pipx-bin" "$t/repo"
          {
            echo "UV_TOOL_DIR=$t/uv-tools"
            echo "UV_TOOL_BIN_DIR=$t/uv-bin"
            echo "PIPX_HOME=$t/pipx"
            echo "PIPX_BIN_DIR=$t/pipx-bin"
            echo "REPO=$t/repo"
            echo "VENV=$t/venv"
          } >> "$GITHUB_ENV"
          echo "$t/uv-bin" >> "$GITHUB_PATH"
          echo "$t/pipx-bin" >> "$GITHUB_PATH"

      - name: Install uv (hash-pinned)
        if: matrix.route == 'uv-tool'
        run: pip install --require-hashes -r requirements/uv.txt

      - name: "1 · ONE install line — the route under test, with [full]"
        run: |
          set -euo pipefail
          case "$ROUTE" in
            uv-tool) uv tool install ".[full]" ;;
            pipx)    pipx install ".[full]" ;;
            pip)
              python -m venv "$VENV"
              if [ -x "$VENV/Scripts/python.exe" ]; then bin="$VENV/Scripts"; else bin="$VENV/bin"; fi
              "$bin/python" -m pip install ".[full]"
              echo "$bin" >> "$GITHUB_PATH" ;;
          esac

      - name: A fresh repo (Python + TypeScript, so graph-ts is exercised)
        working-directory: ${{ env.REPO }}
        run: |
          set -euo pipefail
          git init -q .
          printf 'def charge(total):\n    return total\n\ndef checkout(total):\n    return charge(total)\n' > shop.py
          printf 'export function charge(t: number) { return t }\nexport function checkout(t: number) { return charge(t) }\n' > shop.ts
          command -v mokata
          mokata --version

      - name: "2 · ONE setup — detects and wires, never installs, everything active"
        working-directory: ${{ env.REPO }}
        run: |
          set -euo pipefail
          out="$(mokata setup claude --mode full --yes 2>&1)"; echo "$out"
          if echo "$out" | grep -qE "^installing |via (uv-tool|pipx|pip|uv-pip) …"; then
            echo "::error::setup started an installer — it must only detect and wire"; exit 1
          fi
          if echo "$out" | grep -qE "✗ |PARTIALLY wired|one line installs everything"; then
            echo "::error::full mode is not complete after ONE install line + ONE setup"; exit 1
          fi
          echo "$out" | grep -q "semantic memory model .*active" \
            || { echo "::error::the semantic model row is not active"; exit 1; }

      - name: "3 · doctor: code-review-graph, model2vec, TypeScript parsed"
        working-directory: ${{ env.REPO }}
        run: |
          set -euo pipefail
          out="$(mokata doctor 2>&1 || true)"; echo "$out"
          echo "$out" | grep -q "code graph active (code-review-graph)" \
            || { echo "::error::doctor does not report code-review-graph as the live graph"; exit 1; }
          echo "$out" | grep -qE "semantic: model2vec" \
            || { echo "::error::doctor does not report model2vec as the semantic tier"; exit 1; }
          if echo "$out" | grep -q "graph-ts-absent"; then
            echo "::error::doctor says the TypeScript parser is absent after [full]"; exit 1
          fi

      - name: "4 · the installer's own upgrade keeps the extra"
        if: matrix.route != 'pip'
        working-directory: ${{ env.REPO }}
        run: |
          set -euo pipefail
          case "$ROUTE" in
            uv-tool) uv tool upgrade mokata ;;
            pipx)    pipx reinstall mokata ;;
          esac
          out="$(mokata doctor 2>&1 || true)"
          echo "$out" | grep -q "code graph active (code-review-graph)" \
            || { echo "::error::the upgrade dropped code-review-graph"; echo "$out"; exit 1; }
          echo "$out" | grep -qE "semantic: model2vec" \
            || { echo "::error::the upgrade dropped the embeddings extra"; echo "$out"; exit 1; }
          if echo "$out" | grep -q "graph-ts-absent"; then
            echo "::error::the upgrade dropped the TypeScript parser"; echo "$out"; exit 1
          fi
          echo "ok — the [full] extra survived the $ROUTE upgrade"
