name: live-db-legs (opt-in)

# GR.S2-FU — the OPT-IN live-Postgres legs for the 0.0.15 retrieval substrate.
#
# DB.S2a, DB.S3 and DB.S4 each shipped their Postgres coverage through a psycopg-shaped SHIM that
# executes the real emitted SQL on SQLite. That shim proves the SQL's SHAPE — the WHERE filters,
# the scope composes, the ORDER ranks, every value binds — and each stage recorded, honestly, the
# boundary it CANNOT prove:
#
#   * DB.S2a deviation (1) — psycopg itself: `%s` binding and PG's own ORDER BY seq.
#   * DB.S3  deviation (1) — PG's REAL `to_tsvector`/`ts_rank` RANKING QUALITY (the shim emulates
#                            four text-search primitives narrowly; it cannot rank like PG does).
#   * DB.S4  deviations (1)+(2) — pgvector's real `<=>` + HNSW RECALL, and the stamp round-trip
#                            through a genuinely provisioned index.
#
# This workflow is the leg that closes them. It is OPT-IN — `workflow_dispatch` plus a weekly
# cron — so it NEVER blocks or slows normal CI: nothing here triggers on push or pull_request.
#
# Why a separate workflow rather than a job in ci.yml or beside real-crg.yml:
#   * ci.yml's existing `live-db` job runs on every push/PR (it is BLOCKING by design, and covers
#     tests/integration/test_live_db.py). Adding these legs there would make them blocking, which
#     the stage constraint forbids.
#   * real-crg.yml is dispatched to validate the code-review-graph wire; spinning a Postgres
#     cluster for that dispatch (and vice-versa) conflates two independently-dispatchable legs.
#
# NO REPO SECRETS ARE CONSUMED. The DSN below is a throwaway service-container credential that
# exists only for the life of the job; `MOKATA_TEST_DSN` is declared once in `env:` and never
# echoed by any step.

on:
  workflow_dispatch:
  schedule:
    # Mondays 04:17 UTC — off the hour so it does not pile into GitHub's cron rush.
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  live-db-legs:
    name: live postgres + pgvector legs (opt-in)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    services:
      postgres:
        # Ships the pgvector EXTENSION — but does not enable it. `CREATE EXTENSION vector` is the
        # first statement of the SHIPPED `teamdb.vector_provision_sql`, which DB.S4's live test
        # invokes via `teamdb.provision_vector`. So the extension is created by the code users
        # run, on the init path that owns DDL (D1/C4: no runtime DDL) — not by a bespoke step here.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mokata
          POSTGRES_PASSWORD: mokata
          POSTGRES_DB: mokata_legs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mokata -d mokata_legs"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Password-less DSN + PGPASSWORD (libpq) — no inline credential in a connection string that
      # tests or errors might echo. Throwaway container credential; no repo secret involved.
      MOKATA_TEST_DSN: "postgresql://mokata@localhost:5432/mokata_legs"
      PGPASSWORD: "mokata"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install mokata + the postgres extra
        # `postgres` brings psycopg — the whole point of DB.S2a's leg is that psycopg is REAL here.
        run: pip install -e ".[postgres]"

      - name: Preflight — the image must actually carry pgvector
        # A missing extension would otherwise surface as an opaque DDL error inside DB.S4's leg.
        # Fail here instead, naming the engine and the image.
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, sys, psycopg
          with psycopg.connect(os.environ["MOKATA_TEST_DSN"]) as conn:
              row = conn.execute(
                  "SELECT 1 FROM pg_available_extensions WHERE name = 'vector'").fetchone()
              ver = conn.execute("SHOW server_version").fetchone()[0]
          print(f"postgres {ver}; pgvector available: {bool(row)}")
          if not row:
              print("::error::the postgres service image does not ship pgvector — DB.S4's live "
                    "leg cannot CREATE EXTENSION vector. Expected image pgvector/pgvector:pg16.")
              sys.exit(1)
          PY

      - name: "Preflight — THE LIVE GATE MUST BE ON (a skipped live leg reads GREEN)"
        working-directory: tests/integration
        # DB.S8e. THE failure mode this whole workflow is exposed to, and it is silent: every live
        # module below is wrapped in `@unittest.skipUnless(_PG_LIVE, ...)`. If the DSN is unset, the
        # driver is missing, or the server is unreachable, unittest reports `OK (skipped=N)` and the
        # step goes GREEN — a job that proved nothing, reporting success, indefinitely.
        #
        # This asserts the gate by IMPORTING THE VERY PREDICATE the tests skip on, rather than
        # re-deriving an equivalent check here. Two implementations of "is the DB live" is how a
        # preflight ends up passing while the tests it guards skip anyway; there is one, and it
        # lives with the tests.
        env:
          MOKATA_LIVE_DB: "1"
          MOKATA_PG_DSN: "postgresql://mokata@localhost:5432/mokata_legs"
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          import _support  # noqa: F401  (puts src/ on the path)
          from test_db_s6_live_db import _PG_LIVE, _PG_REASON
          if not _PG_LIVE:
              print(f"::error::the live-DB gate is OFF ({_PG_REASON}). Every leg in this job would "
                    "SKIP, and a skipped live leg reads GREEN — so the job fails here instead of "
                    "reporting success for tests that never ran.")
              sys.exit(1)
          print("live-DB gate ON — the legs below will RUN, not skip.")
          PY

      # The three legs below name their test modules EXPLICITLY — no broad discover. The point of
      # this job is these legs; a discover would drown a red one in 4,000 unrelated passes.
      # `working-directory: tests` matches the repo's `-t tests` top-level (each file does
      # `import _support` to put src/ on the path).

      - name: "Preflight — THE DRIVER-SHAPE GATE MUST BE ON (a skipped shape check reads GREEN)"
        working-directory: tests
        # 0.0.20 stage 08 — `SERVER-VERSION-SHAPE-CHANGE-LAPSES-THE-FLOOR`. The PostgreSQL floor is
        # a PUBLISHED, DATED commitment and its whole enforcement hangs on one third-party read,
        # `conn.info.server_version`. Every other test of the floor drives a psycopg STUB —
        # deliberately, because the floor's logic is mokata's, not psycopg's wire protocol — and a
        # stub has the right shape forever, by construction. `test_c8_pg_driver_shape` is the one
        # place the REAL library is read, and it SKIPS wherever the optional extra is absent.
        #
        # ⛔ A skipped run of it has proven nothing, and would report OK. So the gate is asserted by
        # IMPORTING THE VERY PREDICATE the tests skip on — the same rule the live-DB preflight
        # above states: two implementations of "is the driver real" is how a preflight passes while
        # the tests it guards skip anyway.
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          import _support  # noqa: F401  (puts src/ on the path)
          from test_c8_pg_driver_shape import real_psycopg
          present, reason = real_psycopg()
          if not present:
              print(f"::error::the driver-shape gate is OFF ({reason}). The floor's one input "
                    "would go unchecked against the real library, and the job would report "
                    "success for a check that never ran.")
              sys.exit(1)
          print("driver-shape gate ON — the real psycopg will be read, not skipped.")
          PY

      - name: "Stage 08 — the floor's one input still exists in the REAL driver"
        working-directory: tests
        # ⚠ NO SERVER NEEDED, and that is why this leg is cheap and why it is not waiting on
        # infrastructure. Proving that a real server still yields a parseable major is the OTHER
        # half (08a) and needs the database; proving that psycopg has not renamed, moved or
        # retyped the attribute needs only the installed package.
        run: |
          set -euo pipefail
          if ! python -m unittest -v test_c8_pg_driver_shape; then
            echo "::error::the PostgreSQL floor's single input has changed shape in the real psycopg. Until this is repaired, every server reads FLOOR_UNKNOWN, floor_verdict never returns FLOOR_REFUSE, and mokata's dated public commitment against PG14's EOL is NOT being enforced -- silently, with every other test green."
            exit 1
          fi

      - name: DB.S2a live leg — real psycopg reproduces the pushdown oracle
        working-directory: tests
        # Shim boundary being closed: the emitted SQL ran on SQLite with `%s`→`?`. Red here means
        # psycopg's own binding / PG's ORDER BY seq diverges from the Python-filter oracle.
        run: |
          set -euo pipefail
          if ! python -m unittest -v test_db_s2a_pushdown.LivePostgresPushdownTest; then
            echo "::error::DB.S2a LIVE leg RED on real Postgres/psycopg — the pushed WHERE or ORDER BY seq diverged from the fetch-all-then-filter oracle. The _PgShim (real SQL, but SQLite with %s->?) proved shape only; psycopg is the untested half and it just failed."
            exit 1
          fi

      - name: DB.S2b live leg — real BOOLEAN/jsonb backfill + the scope predicate
        working-directory: tests/integration
        # Shim boundary being closed, and it is the SAFETY-CRITICAL one. Two things in DB.S2b are
        # Postgres SQL no SQLite shim can stand in for: the provisioning BACKFILL (`doc::jsonb->>`
        # with `::boolean`/`::int` casts and `IS DISTINCT FROM`) and the scope predicate binding
        # against real column types. This leg already caught one genuine bug the shim passed —
        # `pin` written as an int, which SQLite accepts and Postgres rejects outright.
        # Red here means a scoped read on a real shared store does not return what
        # `scope.union_read` returns, i.e. rows missing or another tenant's rows visible.
        env:
          MOKATA_LIVE_DB: "1"
          MOKATA_PG_DSN: "postgresql://mokata@localhost:5432/mokata_legs"
        run: |
          set -euo pipefail
          if ! python -m unittest -v test_db_s2b_live_db; then
            echo "::error::DB.S2b LIVE leg RED on real Postgres — the scope pushdown, the jsonb backfill, or the BOOLEAN/int column typing diverged from scope.union_read. This is the cross-tenant visibility path: red here means a scoped recall on a shared store returns the wrong rows."
            exit 1
          fi

      - name: DB.S3 live leg — PG's real tsvector/ts_rank ranking
        working-directory: tests
        # Shim boundary being closed: the shim emulated to_tsvector/to_tsquery/@@/ts_rank narrowly
        # and proved SQL shape only. Red here means PG's ACTUAL ranking does not put the document
        # that answers the query first — i.e. the retrieval-quality claim, on the real engine.
        run: |
          set -euo pipefail
          if ! python -m unittest -v test_db_s3_fts.LivePostgresTest; then
            echo "::error::DB.S3 LIVE leg RED on real Postgres — to_tsvector/ts_rank did not rank the relevant document first. The shim proved the WHERE filters and the values bind; only this leg proves PG's ranking QUALITY, which is the retrieval claim DB.S3 shipped on."
            exit 1
          fi

      - name: DB.S5 live leg — v4 lifecycle schema + usage telemetry on real types
        # `tests/integration`, not `tests` — this step read `tests` and `test_db_s5_live_db.py`
        # has always lived in `tests/integration/`, so the leg died on `ModuleNotFoundError`
        # BEFORE touching Postgres and had never once run. Found 2026-08-02 the first time this
        # workflow was dispatched on the OSS mirror (the private repo's Actions are billing-
        # blocked, so nothing here had executed since it was written). Every OTHER step in this
        # file was audited for the same mismatch at the same time; this was the only one.
        working-directory: tests/integration
        # Shim boundary being closed: the SQLite shim stores `last_recalled_at` as TEXT and hands
        # back exactly what went in, and it has no `= ANY(%s)` array binding at all — so only a
        # real engine proves the TIMESTAMPTZ round trip reads back as something the recency curve
        # can parse, and that the id-array binding matches the right rows. It also runs the
        # `valid_from` backfill (jsonb `->'provenance'->>'created_at'` + `IS DISTINCT FROM`
        # idempotence) against a table that already has rows.
        # Red here means one of: usage telemetry silently records nothing on a shared store (the
        # ranking signal quietly reverts to the pre-DB.S5 floor), one project can read or stamp
        # another's usage, or — the serious one — the v4 migration CLOSED a validity window, which
        # would retire live memory on upgrade and is the exact opposite of the never-delete
        # invariant this schema exists to serve.
        env:
          MOKATA_LIVE_DB: "1"
          MOKATA_PG_DSN: "postgresql://mokata@localhost:5432/mokata_legs"
        run: |
          set -euo pipefail
          if ! python -m unittest -v test_db_s5_live_db; then
            echo "::error::DB.S5 LIVE leg RED on real Postgres — the v4 migration, the validity-window projection, or the usage telemetry diverged on real types. If the backfill closed a window, upgrading retires live memory: that is the never-delete invariant breaking."
            exit 1
          fi

      - name: "DB.S6 live leg — TWO real writers: CAS no-clobber + group-atomic apply + group resolution"
        working-directory: tests/integration
        # Shim boundary being closed, and there are three of them. (1) `_FakeMemPg` IS the CAS — it
        # decides in Python whether a revision matched — so only two independent installs against
        # one shared table show that Postgres's own `UPDATE … WHERE revision = %s` serializes them.
        # (2) The group-atomic apply depends on psycopg3 giving a real BEGIN/ROLLBACK around one
        # approval on an AUTOCOMMIT connection, and on that rollback undoing a statement that had
        # already succeeded; the unit proof uses a fake that snapshots a dict.
        # (3) I1b — a rolled-back approval is then RESOLVED one conflict at a time, so the end state
        # (2) prevents is still reachable by hand: approve the retirement, discard the replacement.
        # Only a real engine can show that the row genuinely lands `superseded` when the guard is
        # absent, which is what makes the refusal worth having.
        # Red here means one of: a stale writer overwrote a teammate's row (the no-clobber claim,
        # gone), or — the serious one — a heal's two writes landed only half, which leaves a
        # subject with its old fact RETIRED and its replacement ABSENT and nothing saying so.
        env:
          MOKATA_LIVE_DB: "1"
          MOKATA_PG_DSN: "postgresql://mokata@localhost:5432/mokata_legs"
        run: |
          set -euo pipefail
          if ! python -m unittest -v test_db_s6_live_db; then
            echo "::error::DB.S6 LIVE leg RED on real Postgres — one of: the revision CAS did not hold between two real writers (a stale write clobbered the winner); one approval's writes were not applied atomically; or (I1b) a rolled-back approval was resolved one member at a time and published a retirement whose replacement was discarded. The last two both end the same way — a subject with its fact RETIRED, nothing in its place, and nothing anywhere saying so. The _FakeMemPg is the CAS in Python and proved none of them."
            exit 1
          fi

      - name: "DB.S7d live leg — TWO real writers: duplicate-both-active + the one-prompt group decision"
        working-directory: tests/integration
        # Shim boundary being closed, and both halves are claims about the SHARED TABLE rather than
        # about local state. (1) "two active facts on one subject" is a statement about what OTHER
        # writers read back out of Postgres — a Python dict standing in for the table can show a
        # resolution being refused, but not that the refusal is what keeps the shared row singular.
        # (2) A whole-approval verdict re-queues N writes at their current remote revisions and the
        # next flush CASes all of them inside one transaction; whether they land TOGETHER depends on
        # psycopg3's real BEGIN/COMMIT and on Postgres's own `UPDATE … WHERE revision = %s`.
        # Red here means one of: the shared table ended up carrying both halves of a heal nobody
        # decided as a whole (a duplicated fact), or — the serious one — a one-prompt group verdict
        # published a retirement whose replacement had already been discarded, which loses the fact
        # in a single prompt the human trusted BECAUSE it claimed to cover the whole approval.
        env:
          MOKATA_LIVE_DB: "1"
          MOKATA_PG_DSN: "postgresql://mokata@localhost:5432/mokata_legs"
        run: |
          set -euo pipefail
          if ! python -m unittest -v test_db_s7d_live_db; then
            echo "::error::DB.S7d LIVE leg RED on real Postgres — either the shared table was left with TWO active facts from one approval that was only half-decided, or a one-prompt group verdict landed a retirement whose replacement was already discarded (the fact is gone, in the single prompt that claimed to cover everything), or the whole-approval verdict did not survive the real CAS flush. _FakeMemPg is the CAS in Python and proved none of them."
            exit 1
          fi

      - name: DB.S4 live leg — real pgvector <=> + HNSW recall + stamp round-trip
        working-directory: tests
        # Shim boundary being closed: `_PgVectorShim` stood in for `<=>` as cosine. Red here means
        # either HNSW does not recall the seeded vector, or the embedder stamp written by
        # provision_vector does not read back — the two things only a real index can show.
        run: |
          set -euo pipefail
          if ! python -m unittest -v test_db_s4_pgvector.TestLivePgVector; then
            echo "::error::DB.S4 LIVE leg RED on real pgvector — either the HNSW index did not recall the seeded vector via <=>, or the embedder stamp written by provision_vector did not round-trip. _PgVectorShim emulated <=> and proved neither."
            exit 1
          fi

      # ---------------------------------------------------------------- DB.S8e: THE EIGHT ORPHANS
      # Every module below shipped a live leg with its stage and then ran in NEITHER workflow:
      # `ci.yml`'s live-db job runs ONLY `test_live_db.py` (`-p "test_live_db.py"`), and the steps
      # above name their modules explicitly. So DB.S7a/b/c1/c2, H-1a, H-6, M-1/R9 and TM.S5b were
      # each written, verified on-device, recorded as evidence in doc 02 — and then never run again
      # by anything. That is the reachability pattern doc 84 files, in CI form: code that exists,
      # is believed covered, and has no runner.
      #
      # They run in ONE step because they share a gate and a database, and because eight
      # near-identical steps is how the ninth gets forgotten. The modules are still NAMED (never a
      # broad discover) so a red one is identifiable, and `-v` keeps per-test output.
      - name: "DB.S8e — the eight legs that ran in NEITHER workflow"
        working-directory: tests/integration
        env:
          MOKATA_LIVE_DB: "1"
          MOKATA_PG_DSN: "postgresql://mokata@localhost:5432/mokata_legs"
        run: |
          set -euo pipefail
          if ! python -m unittest -v \
              test_db_s7a_live_db test_db_s7b_live_db test_db_s7c1_live_db test_db_s7c2_live_db \
              test_h1a_live_db test_h6_live_db test_m1_r9_live_db test_tm_s5b_live_db; then
            echo "::error::one of the eight previously-unwired live legs is RED on real Postgres. These cover the DB.S7 edge substrate + traversal + edge-aware healing + stale refs, H-1a per-turn injection, H-6 code-anchor staleness, M-1/R9's consent chain on real types, and TM.S5b's journal-first store. Each was verified on-device at its own stage and then run by nothing until DB.S8e; a red here is a regression that had no runner to catch it."
            exit 1
          fi

      - name: "DB.S8c — S-1 + S-4 at N=100,000 on the real engine"
        working-directory: tests/integration
        # The scale leg. Shim boundary being closed: S-1 is "query plans + row counts" and a PLAN is
        # something only a planner produces — the _PgShim would EXPLAIN SQLite and report green
        # about Postgres. S-4's winner is decided by Postgres's own `UPDATE … WHERE revision = %s`,
        # and every unit-suite double IS that CAS in Python.
        env:
          MOKATA_LIVE_DB: "1"
          MOKATA_PG_DSN: "postgresql://mokata@localhost:5432/mokata_legs"
        run: |
          set -euo pipefail
          out=$(python -m unittest -v test_db_s8c_live_db 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          # THE SKIP GUARD, and it is separate from the preflight ON PURPOSE. The preflight proves
          # the gate was on before anything ran; this proves THIS module actually ran, which is a
          # different claim — a module can skip for its own reasons (a missing import, a
          # `setUpClass` guard) long after the gate has been shown healthy. Doc 52 calls the 100k
          # contracts the release's validation bar, so "it skipped" must never reach the summary
          # as "it passed".
          if grep -qE "skipped=[1-9]" <<<"$out"; then
            echo "::error::the DB.S8c SCALE leg SKIPPED tests rather than running them. A skipped live leg reads GREEN, and this is the leg doc 52 names as the 100k validation bar — so the job fails rather than reporting a bar that was never measured."
            exit 1
          fi
          if ! grep -qE "^Ran [1-9][0-9]* test" <<<"$out"; then
            echo "::error::the DB.S8c scale leg ran ZERO tests — the module was collected but empty, which reads as success and proves nothing."
            exit 1
          fi

      - name: Summary
        run: |
          echo "ok — DB.S2a (psycopg) · DB.S2b (scope pushdown + jsonb backfill) · DB.S3 (ts_rank)"
          echo "· DB.S5 (v4 lifecycle + usage telemetry on real types) · DB.S6 (two-writer CAS +"
          echo "group-atomic apply) · DB.S7d (duplicate-both-active + group decision) · DB.S4"
          echo "(pgvector/HNSW) all green on the real engines."
          echo "DB.S8e — plus the eight legs that previously ran in NEITHER workflow: DB.S7a/b/c1/c2,"
          echo "H-1a, H-6, M-1/R9, TM.S5b."
          echo "DB.S8c — S-1 (index-bound plans + row counts) and S-4 (two real writers) at"
          echo "N=100,000, with a preflight and a skip guard so a leg that did not run cannot"
          echo "report as one that passed."
          echo "The recorded shim boundaries are measured, not assumed."

  # ==============================================================================================
  # 0.0.20 stage 08a, FIRST SLICE — the below-floor arm, against a server that really is below it.
  #
  # THE SENTENCE THIS EXISTS TO RETIRE, from the release notes: "a genuinely below-floor server — a
  # real PostgreSQL 14 — was never used. The below-floor arm is therefore proven against a
  # simulated version report and not against the database it describes."
  #
  # ⭐ A SEPARATE JOB AND A SEPARATE CONTAINER, on purpose. The job above runs
  # `pgvector/pgvector:pg16` because every leg in it needs a modern server and the extension. A
  # below-floor arm needs a server that is genuinely OLD, and it needs no extension and no schema:
  # the entire subject is the version handshake.
  #
  # ⛔ AND IT MAY NOT RETIRE THE DISCLOSURE UNTIL IT IS SEEN GREEN. It was written by a coordinator
  # that cannot run GitHub Actions. Retiring a disclosure on the PRESENCE of a check rather than on
  # its RESULT is `DISCLOSURE-PRESENCE-IS-NOT-DISCLOSURE-TRUTH`, a row this repo already carries.
  pg-floor-below:
    name: the floor REFUSES a real below-floor server (opt-in)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    services:
      postgres14:
        # This image is DELIBERATELY under `MIN_PG_MAJOR`, because being under it is the entire
        # fixture: the arm exists to prove mokata REFUSES a real below-floor server, and a
        # compliant image would let every assertion pass while proving the opposite.
        # `tests/_pg_floor.py` reads the marker below, excuses this ONE tag, and reds if the marker
        # ever stops sitting on a below-floor image (`unearned_markers`) — so the exemption cannot
        # outlive the thing it exempts. The pg16 image in the job above is still graded normally,
        # which is why this is a marker and not a deny-listed file.
        #
        # ⚠ THE MARKER RIDES THE IMAGE LINE ITSELF, not this block. The first draft put it at the
        # top of these comments, seven lines up, and the guard REFUSED IT — correctly: a marker
        # that reached that far could drift onto a different image the day somebody edits the
        # prose above it. It reaches the tag's own line and the one immediately above, and nothing
        # else, which is the property `test_a_marker_two_lines_up_does_NOT_reach` pins.
        image: postgres:14  # pg-floor: BELOW BY DESIGN — the fixture IS the violation
        env:
          POSTGRES_USER: mokata
          POSTGRES_PASSWORD: mokata
          POSTGRES_DB: mokata_floor
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U mokata -d mokata_floor"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Password-less DSN + PGPASSWORD (libpq), same rule as the job above: no inline credential in
      # a connection string that a test or an error might echo. Throwaway container credential.
      MOKATA_PG_BELOW_DSN: "postgresql://mokata@localhost:5433/mokata_floor"
      PGPASSWORD: "mokata"
      MOKATA_LIVE_DB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install mokata + the postgres extra (NOT editable, and that is deliberate)
        # ⚠ `pip install`, not `pip install -e`. This job needs psycopg and mokata importable and
        # nothing more — the tests put `src/` on the path themselves via `_support`, so the TREE is
        # what runs either way. An editable install would join a population
        # `test_pinned_dependency_property` reconciles against an external Dependabot reading that
        # only a human can re-take, and a ninth editable site would falsify that row's finding
        # ("eight sites, seven alerts, one blind spot") until somebody re-read the alert list. That
        # is a real cost paid for an editability this job does not use. The guard caught it the
        # moment the job landed — for the second time this release.
        run: pip install ".[postgres]"

      - name: "Preflight — THE BELOW-FLOOR GATE MUST BE ON (a skipped arm reads GREEN)"
        working-directory: tests/integration
        # Same rule the job above states twice: assert the gate by IMPORTING THE VERY PREDICATE the
        # tests skip on. Two implementations of "is the below-floor server up" is how a preflight
        # passes while the test it guards skips anyway.
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          import _support  # noqa: F401  (puts src/ on the path)
          from test_c8a_pg_floor_below_live import below_floor_live
          on, reason = below_floor_live()
          if not on:
              print(f"::error::the below-floor arm is OFF ({reason}). It would SKIP, and a skipped "
                    "arm reads GREEN — so the job fails here instead of reporting success for the "
                    "one check the release notes' disclosure is waiting on.")
              sys.exit(1)
          print("below-floor gate ON — the arm below will RUN, not skip.")
          PY

      - name: "Preflight — AND THE SERVER MUST REALLY BE BELOW THE FLOOR"
        working-directory: tests/integration
        # ⭐ The precondition, asserted before the arm rather than inside it. A container tag that
        # silently resolved to something modern would let every assertion pass while proving the
        # OPPOSITE of what this job claims — and the tag is the one thing here nobody controls.
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, sys
          import _support  # noqa: F401
          import psycopg
          from mokata import teamdb
          with psycopg.connect(os.environ["MOKATA_PG_BELOW_DSN"]) as conn:
              major = teamdb._server_major(conn)
              shown = conn.execute("SHOW server_version").fetchone()[0]
          print(f"server reports {shown!r}; mokata reads major {major!r}; floor is "
                f"{teamdb.MIN_PG_MAJOR}")
          if major is None:
              print("::error::mokata could not read a major from a REAL, REACHABLE connection — "
                    "that is SERVER-VERSION-SHAPE-CHANGE-LAPSES-THE-FLOOR happening live.")
              sys.exit(1)
          if major >= teamdb.MIN_PG_MAJOR:
              print(f"::error::this job's service is NOT below the floor ({major} >= "
                    f"{teamdb.MIN_PG_MAJOR}). The arm would pass and prove the opposite of what it "
                    "claims. Pin the service image to a genuinely below-floor major.")
              sys.exit(1)
          PY

      - name: Stage 08a — the floor REFUSES a real below-floor server
        working-directory: tests/integration
        run: |
          set -euo pipefail
          if ! python -m unittest -v test_c8a_pg_floor_below_live; then
            echo "::error::the below-floor arm is RED against a real PostgreSQL below the floor. mokata's published, dated commitment against PG14's end-of-life is not being met by the code that is supposed to enforce it."
            exit 1
          fi
