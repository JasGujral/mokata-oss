name: probe-linux-hang
on:
  push:
    branches: ["probe/0027-linuxhang-*"]
permissions:
  contents: read
jobs:
  tableview:
    strategy:
      fail-fast: false
      matrix:
        attempt: [1]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements/e2e.txt
      - run: python -m playwright install chromium
      - name: full e2e, with the busiest processes every 20 s
        env:
          MOKATA_REQUIRE_E2E: '1'
        run: |
          ( while true; do sleep 20; echo "=== $(date +%T) load $(cut -d' ' -f1-3 /proc/loadavg)"; ps -eo pid,ppid,etimes,pcpu,rss,args --sort=-pcpu | grep -v "ps -eo" | head -8 | cut -c1-220; echo "mokata procs: $(ps -eo args | grep -c '[m]okata')"; done ) &
          W=$!
          python tests/e2e_ide/run_e2e.py -v > e2e.log 2>&1; echo "e2e exit $?"
          kill $W
          grep -E "^Ran|^OK|^FAILED|^(ERROR|FAIL):" e2e.log
          echo "---- left running after the suite"; ps -eo pid,ppid,etimes,pcpu,args | grep -E "[m]okata|[c]ode-review|[p]ython" | cut -c1-220
