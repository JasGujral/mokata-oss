name: probe-linux-hang
on:
  push:
    branches: ["probe/0027-linuxhang-*"]
permissions:
  contents: read
jobs:
  p24:
    strategy:
      fail-fast: false
      matrix:
        tree: [cifix, release0027]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - if: matrix.tree == 'release0027'
        run: git checkout origin/release/0.0.27 -- src tests
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: pip install -e . && pip install --require-hashes -r requirements/ci.txt && pip install --require-hashes -r requirements/jsonschema.txt
      - name: the p24 stopping class, as another user, all-thread dumps every 90 s
        run: |
          set +e
          sudo useradd -m probe
          chmod -R a+rwX "$GITHUB_WORKSPACE"; chmod a+rx /home/runner /home/runner/work
          PY=$(which python)
          cat > /tmp/run1.py <<'PYEOF'
          import faulthandler, sys, unittest
          faulthandler.dump_traceback_later(90, repeat=True)
          sys.path.insert(0, sys.argv.pop(1)); import os; os.chdir(sys.path[0] + "/..")
          names = sys.argv[1:]
          suite = unittest.defaultTestLoader.loadTestsFromNames(names)
          r = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if r.wasSuccessful() else 1)
          PYEOF
          chmod a+r /tmp/run1.py
          sudo -u probe -H env PYTHONUNBUFFERED=1 PATH="$(dirname $PY):/usr/bin:/bin" \
            timeout -s KILL 600 "$PY" /tmp/run1.py "$GITHUB_WORKSPACE/tests" \
            test_p24_ide_lsp_readonly.StoppingNeverHangsAndKillsTheTree \
            > p24.log 2>&1 < /dev/null
          echo "exit: $?"
          head -c 60000 p24.log
          echo "---- processes of user probe"; ps -u probe -o pid,ppid,pgid,sid,etimes,stat,args --forest
          sudo pkill -9 -u probe || true
          exit 0
