name: probe-linux-hang
on:
  push:
    branches: ["probe/0027-linuxhang-*"]
permissions:
  contents: read
jobs:
  tableview:
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements/e2e.txt
      - run: python -m playwright install chromium
      - name: time the first open of the uncountable CSV
        run: |
          timeout 200 python .github/probe/time_first_open.py "$PWD/tests/e2e_ide" 2>&1 | tail -60 || true
          echo "---- the same, run in a second fresh repo"
          timeout 200 python .github/probe/time_first_open.py "$PWD/tests/e2e_ide" 2>&1 | tail -60 || true
