name: probe-linux-hang
on:
  push:
    branches: ["probe/0027-linuxhang-*"]
permissions:
  contents: read
jobs:
  tableview:
    strategy:
      fail-fast: false
      matrix:
        attempt: [1]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements/e2e.txt
      - run: python -m playwright install chromium
      - name: table view alone, then the full suite, dumping the page on a failed open
        env:
          MOKATA_REQUIRE_E2E: '1'
        run: |
          set +e
          python tests/e2e_ide/run_e2e.py -v -k test_table_view > tv.log 2>&1; echo "tv-alone exit $?"
          grep -E "^Ran|^OK|^FAILED|^(ERROR|FAIL):" tv.log; grep -A40 "PROBE-DUMP" tv.log | head -120
          python tests/e2e_ide/run_e2e.py -v > e2e.log 2>&1; echo "full exit $?"
          grep -E "^Ran|^OK|^FAILED|^(ERROR|FAIL):" e2e.log; grep -A40 "PROBE-DUMP" e2e.log | head -160
          exit 0
